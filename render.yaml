services:
  - type: web
    name: sgb-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PRIVATE_KEY
        sync: false
      - key: WEB3_PROVIDER
        value: http://host.docker.internal:8545
